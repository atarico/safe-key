[package]
name = "safekey"
version = "0.1.0"
description = "Safekey — source-available password manager"
authors = []
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "safekey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database — SQLite encriptado
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }

# Crypto — Argon2id key derivation
argon2 = "0.5"

# Crypto — AES-256-GCM authenticated encryption
aes-gcm = "0.10"

# Crypto — random nonce/salt generation
rand = "0.8"

# Secrets — secure memory wiping on drop
zeroize = { version = "1.7", features = ["derive"] }
secrecy = { version = "0.8", features = ["serde"] }

# CSV interchange with other password managers
csv = "1"

# Utilities
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
anyhow = "1"
dirs = "5"

[[bin]]
name = "safekey-host"
path = "src/bin/safekey_host.rs"

